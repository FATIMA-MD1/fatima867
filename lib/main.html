<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>FATIMA-MD // KERNEL-LINK V5</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: #030508;
      color: #00ffcc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Terminal Scanlines & Matrix Grid */
    .matrix-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 3px 100%;
      z-index: 2;
      pointer-events: none;
    }

    .circuit-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 255, 204, 0.05) 0%, transparent 70%),
        linear-gradient(rgba(0, 255, 204, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 204, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
      z-index: 1;
    }

    .terminal-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 520px;
      padding: 15px;
    }

    .terminal-window {
      background: rgba(4, 9, 15, 0.95);
      border: 1px solid #00ffcc;
      border-radius: 6px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.15),
                  inset 0 0 15px rgba(0, 255, 204, 0.05);
      overflow: hidden;
      position: relative;
    }

    /* Terminal Header Bar */
    .terminal-bar {
      background: #08121f;
      border-bottom: 1px solid #00ffcc;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .terminal-dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot-red { background: #ff5f56; border: 1px solid #e0443e; }
    .dot-yellow { background: #ffbd2e; border: 1px solid #dea123; }
    .dot-green { background: #27c93f; border: 1px solid #1aab29; }

    .terminal-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: #00ffcc;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .terminal-body {
      padding: 25px;
    }

    /* System Stats / Headers */
    .sys-log {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 20px;
      border-left: 2px solid #00ffcc;
      padding-left: 10px;
      line-height: 1.5;
    }

    .sys-log span {
      color: #00ffcc;
    }

    /* Form Layout */
    .input-group {
      margin-bottom: 20px;
    }

    .label-code {
      display: block;
      font-size: 12px;
      color: #00ffcc;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-wrapper-tech {
      position: relative;
    }

    .input-wrapper-tech i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #008866;
      font-size: 14px;
    }

    .tech-input {
      width: 100%;
      padding: 14px 15px 14px 42px;
      background: #020408;
      border: 1px solid #008866;
      border-radius: 4px;
      color: #00ffcc;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .tech-input:focus {
      border-color: #00ffcc;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
    }

    .tech-input::placeholder {
      color: #1a4d40;
    }

    /* Buttons */
    .btn-tech {
      width: 100%;
      padding: 14px;
      background: #00332c;
      border: 1px solid #00ffcc;
      border-radius: 4px;
      color: #00ffcc;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      margin-bottom: 15px;
    }

    .btn-tech:hover:not(:disabled) {
      background: #00ffcc;
      color: #030508;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
    }

    .btn-tech:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-copy-tech {
      background: #041f1b;
      border-color: #00aa88;
      color: #00cc99;
      display: none;
    }

    /* Loader */
    .sys-loader {
      display: none;
      text-align: center;
      margin: 15px 0;
      font-size: 11px;
      color: #00ffcc;
    }

    .code-console-screen {
      background: #010204;
      border: 1px dashed #008866;
      border-radius: 4px;
      padding: 18px;
      text-align: center;
      margin-bottom: 15px;
      min-height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .code-console-screen.success {
      border-style: solid;
      border-color: #00ffcc;
      background: rgba(0, 255, 204, 0.05);
      box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.1);
    }

    .code-console-screen.error {
      border-style: solid;
      border-color: #ff3333;
      background: rgba(255, 51, 51, 0.05);
    }

    .console-placeholder {
      font-size: 12px;
      color: #1a4d40;
    }

    .console-code {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #00ffcc;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
    }

    .console-error {
      font-size: 12px;
      color: #ff3333;
    }

    /* Footer Meta */
    .terminal-footer {
      border-top: 1px dashed #004433;
      padding-top: 12px;
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #008866;
    }

    /* Toast */
    .sys-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: #08121f;
      border: 1px solid #00ffcc;
      color: #00ffcc;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 11px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .sys-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="matrix-overlay"></div>
  <div class="circuit-bg"></div>

  <div class="terminal-container">
    <div class="terminal-window">
      <div class="terminal-bar">
        <div class="terminal-dots">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
        </div>
        <div class="terminal-title">FATIMA-MD // KERNEL LINK</div>
        <div style="width: 36px;"></div>
      </div>

      <div class="terminal-body">
        <div class="sys-log">
          STATUS: <span>ONLINE</span> | PROTOCOL: <span>WSS-PAIR-V5</span><br>
          TARGET: <span>MULTIDEVICE_GATEWAY</span>
        </div>

        <form id="pairForm">
          <div class="input-group">
            <label class="label-code">> Input Target MSISDN:</label>
            <div class="input-wrapper-tech">
              <input 
                type="tel" 
                id="phoneNumber" 
                class="tech-input" 
                placeholder="923155641171"
                pattern="[0-9]+"
                required
              >
              <i class="fa-solid fa-terminal"></i>
            </div>
          </div>

          <button type="submit" class="btn-tech" id="generateBtn">
            <i class="fa-solid fa-microchip">> Initialize Handshake</i>
          </button>

          <div class="sys-loader" id="loadingState">
            [+] Requesting socket buffer payload... Please wait.
          </div>

          <div class="code-console-screen" id="codeBox">
            <div class="console-placeholder">[ WAITING FOR EXECUTION SIGNAL ]</div>
          </div>

          <button type="button" class="btn-tech btn-copy-tech" id="copyBtn">
            <i class="fa-solid fa-copy">> Copy Secure Buffer Token</i>
          </button>
        </form>

        <div class="terminal-footer">
          <span>BUILD: 2026.4.2-STABLE</span>
          <span>SECURE_SOCKET: ACTIVE</span>
        </div>
      </div>
    </div>
  </div>

  <div class="sys-toast" id="toastAlert">
    <span id="toastText">Operation executed successfully</span>
  </div>

  <script>
    const phoneInput = document.getElementById('phoneNumber');
    const generateBtn = document.getElementById('generateBtn');
    const loadingState = document.getElementById('loadingState');
    const codeBox = document.getElementById('codeBox');
    const copyBtn = document.getElementById('copyBtn');
    const toastAlert = document.getElementById('toastAlert');
    const toastText = document.getElementById('toastText');
    const form = document.getElementById('pairForm');

    let activeToken = null;

    function showToast(msg) {
      toastText.textContent = `> ${msg}`;
      toastAlert.classList.add('show');
      setTimeout(() => {
        toastAlert.classList.remove('show');
      }, 2500);
    }

    function renderError(err) {
      codeBox.className = 'code-console-screen error';
      codeBox.innerHTML = `<div class="console-error">[ERR] ${err}</div>`;
      copyBtn.style.display = 'none';
    }

    function renderCode(code) {
      activeToken = code;
      codeBox.className = 'code-console-screen success';
      codeBox.innerHTML = `<div class="console-code">${code}</div>`;
      copyBtn.style.display = 'flex';
    }

    function resetScreen() {
      codeBox.className = 'code-console-screen';
      codeBox.innerHTML = '<div class="console-placeholder">[ WAITING FOR EXECUTION SIGNAL ]</div>';
      copyBtn.style.display = 'none';
      activeToken = null;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const num = phoneInput.value.trim();

      if (!num || num.length < 10) {
        renderError('INVALID_MSISDN_LENGTH');
        showToast('Check number format');
        return;
      }

      generateBtn.style.display = 'none';
      loadingState.style.display = 'block';
      resetScreen();

      try {
        const clean = num.replace(/[^\d]/g, '');
        const res = await fetch(`/code?number=${clean}`);
        if (!res.ok) throw new Error('GATEWAY_TIMEOUT');
        
        const data = await res.json();
        if (data.code && data.code !== 'Service Unavailable') {
          renderCode(data.code);
          showToast('Pair token generated successfully');
        } else {
          throw new Error('BUFFER_REFUSED');
        }
      } catch (err) {
        renderError(err.message || 'HANDSHAKE_FAILED');
        showToast('Execution failed');
      } finally {
        generateBtn.style.display = 'flex';
        loadingState.style.display = 'none';
      }
    });

    copyBtn.addEventListener('click', async () => {
      if (!activeToken) return;
      try {
        await navigator.clipboard.writeText(activeToken);
        showToast('Token written to clipboard buffer');
      } catch (e) {
        showToast('Buffer copy error');
      }
    });

    phoneInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^\d]/g, '');
    });
  </script>
</body>
</html>
